<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marquee infinito</title>
<style>
  :root{
    --bg:#07120E; --surface:#0F1F18; --border:#25382E;
    --text:#E8F5EE; --muted:#A7BFB3; --accent:#34D399; --accent-2:#A7F3D0;
  }
  *{margin:0;box-sizing:border-box}
  body{
    min-height:100vh;display:grid;align-content:center;gap:1.25rem;
    background:
      radial-gradient(60% 50% at 50% 50%, rgba(52,211,153,.08) 0%, transparent 70%),
      var(--bg);
    color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;
  }
  .caption{text-align:center;color:var(--muted);font-size:.85rem;letter-spacing:.04em}

  .marquee{
    --gap:3rem;--speed:26s;
    position:relative;display:flex;overflow:hidden;gap:var(--gap);
    user-select:none;
    /* Desvanecido en los bordes para un loop limpio */
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  }
  /* Cada track es una copia idéntica; con dos tracks el bucle es perfecto */
  .track{
    flex:0 0 auto;display:flex;align-items:center;gap:var(--gap);
    padding-right:var(--gap);
    animation:scroll var(--speed) linear infinite;will-change:transform;
  }
  .marquee:hover .track{animation-play-state:paused}
  .marquee.rev .track{animation-direction:reverse;--speed:34s}

  .item{
    display:inline-flex;align-items:center;gap:.6rem;white-space:nowrap;
    font-size:clamp(1.4rem,4vw,2.4rem);font-weight:600;letter-spacing:-.02em;
    color:var(--text);
  }
  .item.ghost{color:transparent;-webkit-text-stroke:1.4px var(--accent);text-stroke:1.4px var(--accent)}
  .star{color:var(--accent-2);flex:0 0 auto}

  @keyframes scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-100%,0,0)}}
  @media (prefers-reduced-motion:reduce){
    .track{animation:none}
    .marquee{overflow-x:auto}
  }
</style></head>
<body>
  <p class="caption">Cinta infinita — pasa el cursor para pausar</p>

  <div class="marquee" id="m1" aria-label="Cinta de marca">
    <div class="track">
      <span class="item">Diseño con carácter</span>
      <span class="star">✦</span>
      <span class="item ghost">Motion intencional</span>
      <span class="star">✦</span>
      <span class="item">Detalle premium</span>
      <span class="star">✦</span>
      <span class="item ghost">Sin slop</span>
      <span class="star">✦</span>
    </div>
    <div class="track" aria-hidden="true">
      <span class="item">Diseño con carácter</span>
      <span class="star">✦</span>
      <span class="item ghost">Motion intencional</span>
      <span class="star">✦</span>
      <span class="item">Detalle premium</span>
      <span class="star">✦</span>
      <span class="item ghost">Sin slop</span>
      <span class="star">✦</span>
    </div>
  </div>

  <div class="marquee rev" id="m2" aria-hidden="true">
    <div class="track">
      <span class="item ghost">Emerald Lab</span>
      <span class="star">●</span>
      <span class="item">Dark premium</span>
      <span class="star">●</span>
      <span class="item ghost">GPU compositing</span>
      <span class="star">●</span>
      <span class="item">60fps</span>
      <span class="star">●</span>
    </div>
    <div class="track">
      <span class="item ghost">Emerald Lab</span>
      <span class="star">●</span>
      <span class="item">Dark premium</span>
      <span class="star">●</span>
      <span class="item ghost">GPU compositing</span>
      <span class="star">●</span>
      <span class="item">60fps</span>
      <span class="star">●</span>
    </div>
  </div>
</body></html>
