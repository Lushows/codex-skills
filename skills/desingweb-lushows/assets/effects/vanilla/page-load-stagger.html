<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page-load stagger</title>
<style>
  :root{
    --ease:cubic-bezier(.2,.8,.2,1);
    --bg:#07120E; --surface:#0F1F18; --text:#E8F5EE; --muted:#A7BFB3;
    --accent:#34D399; --accent-2:#A7F3D0; --text-inv:#06231A; --border:#25382E;
  }
  *{margin:0;box-sizing:border-box}
  body{
    min-height:100vh;display:grid;place-items:center;
    background:
      radial-gradient(60% 50% at 18% 12%, rgba(52,211,153,.16) 0%, transparent 60%),
      radial-gradient(50% 50% at 88% 90%, rgba(167,243,208,.10) 0%, transparent 60%),
      var(--bg);
    color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .hero{max-width:680px;padding:2.5rem;text-align:left}
  .eyebrow{
    display:inline-flex;align-items:center;gap:.5rem;
    font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent-2);margin-bottom:1.25rem;
  }
  .eyebrow::before{content:"";width:28px;height:1px;background:var(--accent)}
  .reveal{opacity:0;transform:translateY(26px);animation:fadeUp .72s var(--ease) forwards}
  .reveal:nth-child(1){animation-delay:.04s}
  .reveal:nth-child(2){animation-delay:.16s}
  .reveal:nth-child(3){animation-delay:.30s}
  .reveal:nth-child(4){animation-delay:.44s}
  h1{font-size:clamp(2.2rem,6vw,3.8rem);letter-spacing:-.035em;line-height:1.02;font-weight:600}
  h1 em{font-style:normal;color:var(--accent)}
  p{margin-top:1.1rem;color:var(--muted);font-size:clamp(1rem,2.2vw,1.18rem);line-height:1.6;max-width:46ch}
  .btn{
    margin-top:1.75rem;display:inline-flex;align-items:center;gap:.6rem;
    padding:.85rem 1.6rem;border-radius:12px;background:var(--accent);
    color:var(--text-inv);text-decoration:none;font-weight:600;
    transition:transform .2s var(--ease),background-color .2s var(--ease);
  }
  .btn:hover{transform:translateY(-2px);background:var(--accent-2)}
  .btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
  .btn svg{transition:transform .2s var(--ease)}
  .btn:hover svg{transform:translateX(3px)}
  @keyframes fadeUp{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .reveal{animation:none;opacity:1;transform:none}
    .btn{transition:none}
  }
</style></head>
<body>
  <div class="hero">
    <span class="eyebrow reveal">Motion design</span>
    <h1 class="reveal">Movimiento con <em>intención</em></h1>
    <p class="reveal">Un page-load orquestado vale más que diez microinteracciones dispersas. El orden importa: cada elemento entra cuando el ojo lo busca.</p>
    <a href="#" class="btn reveal">Empezar
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</body></html>
