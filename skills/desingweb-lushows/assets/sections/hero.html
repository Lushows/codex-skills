<!-- SECCIÓN: Hero (dark premium). Copia el <section> + <style>. -->
<section class="dw-hero">
  <div class="dw-hero__glow" aria-hidden="true"></div>
  <div class="dw-hero__inner">
    <span class="dw-hero__eyebrow">Hongos funcionales · BIO-SETA</span>
    <h1 class="dw-hero__title">Tu mente, más clara.<br>Tu cuerpo, más fuerte.</h1>
    <p class="dw-hero__sub">Melena de León, Cordyceps y Reishi de laboratorio. Calidad real, resultados reales.</p>
    <div class="dw-hero__actions">
      <a class="dw-btn dw-btn--primary" href="#">Ver productos</a>
      <a class="dw-btn dw-btn--ghost" href="#">Hablar con Addrian</a>
    </div>
  </div>
</section>
<style>
  .dw-hero{position:relative;overflow:hidden;background:#07120E;color:#E8F5EE;padding:7rem 1.5rem;font-family:system-ui,sans-serif;text-align:center}
  .dw-hero__glow{position:absolute;inset:-20% 10% auto;height:60%;background:radial-gradient(60% 60% at 50% 0%,#34D39955,transparent 70%);filter:blur(40px);animation:dw-hero-breathe 9s ease-in-out infinite}
  .dw-hero__inner{position:relative;max-width:760px;margin:0 auto}
  .dw-hero__eyebrow{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:#5B7A6B}
  .dw-hero__title{margin:1rem 0;font-size:clamp(2.4rem,7vw,4.2rem);line-height:1.04;letter-spacing:-.03em;font-weight:700}
  .dw-hero__sub{color:#A7C3B5;max-width:48ch;margin:0 auto;font-size:1.1rem}
  .dw-hero__actions{margin-top:2rem;display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
  .dw-btn{padding:.85rem 1.5rem;border-radius:999px;text-decoration:none;font-weight:600;transition:transform .2s,box-shadow .2s}
  .dw-btn:focus-visible{outline:2px solid #34D399;outline-offset:3px}
  .dw-btn--primary{background:#34D399;color:#06231A;box-shadow:0 8px 30px #34D39933}
  .dw-btn--primary:hover{transform:translateY(-2px);box-shadow:0 12px 40px #34D39955}
  .dw-btn--ghost{border:1px solid #2D4A3C;color:#E8F5EE}
  .dw-btn--ghost:hover{background:#0F1F18}
  @keyframes dw-hero-breathe{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
  @media (prefers-reduced-motion:reduce){.dw-hero__glow{animation:none}}
</style>
